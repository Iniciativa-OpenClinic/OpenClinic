name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: openclinic
  WEBAPP_IMAGE_NAME: openclinic/openclinic-webapp
  API_IMAGE_NAME: openclinic/openclinic-api

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Types
        run: npm run build -w packages/core

      - name: Run Strict Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

  migrations:
    uses: ./.github/workflows/migrations.yml

  build-and-publish:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [validate, migrations]
    if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_TOKEN != ''
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # === 1. Build e Push da API Backend ===
      - name: Extract Metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # type=sha,format=short # Descomente para tags imutáveis por commit (ex: sha-xxxxxxx)
          labels: |
            maintainer=Iniciativa OpenClinic
            org.opencontainers.image.authors=Iniciativa OpenClinic
            org.opencontainers.image.vendor=Iniciativa OpenClinic
            org.opencontainers.image.source=https://github.com/Iniciativa-OpenClinic/OpenClinic

      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # === 2. Build e Push do Frontend Webapp ===
      - name: Extract Metadata for Webapp
        id: meta-webapp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEBAPP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # type=sha,format=short # Descomente para tags imutáveis por commit (ex: sha-xxxxxxx)
          labels: |
            maintainer=Iniciativa OpenClinic
            org.opencontainers.image.authors=Iniciativa OpenClinic
            org.opencontainers.image.vendor=Iniciativa OpenClinic
            org.opencontainers.image.source=https://github.com/Iniciativa-OpenClinic/OpenClinic

      - name: Build and Push Frontend Webapp Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.webapp
          push: true
          tags: ${{ steps.meta-webapp.outputs.tags }}
          labels: ${{ steps.meta-webapp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
