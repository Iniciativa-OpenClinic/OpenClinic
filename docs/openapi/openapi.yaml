  /api/v1/business/appointments/{id}/status:
    patch:
      summary: Change appointment status
      tags:
        - Appointments
      description: Requires op_schedule WRITE. Enforces the documented lifecycle;
        terminal states cannot be reopened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - SCHEDULED
                    - CONFIRMED
                    - ARRIVED
                    - IN_PROGRESS
                    - COMPLETED
                    - NO_SHOW
                    - CANCELLED
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 36
            pattern: \S
          in: path
          name: id
          required: true
      security:
        - BearerAuth: []
