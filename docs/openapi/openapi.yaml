openapi: 3.0.3
info:
  title: OpenClinic — Electronic Health Record (EHR) & Governance API
  description: Open, modular, and auditable Electronic Health Record (EHR) and
    Clinical Management API with hybrid access control (RBAC + ACL),
    multi-tenancy, dynamic capabilities resolution, and enterprise security
    (Argon2id + in-memory JWT).
  version: 0.1.0
  contact:
    name: Iniciativa OpenClinic
    url: https://github.com/Iniciativa-OpenClinic/OpenClinic
  license:
    name: GNU AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Bearer token in Authorization header: `Bearer <token>`"
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details error format
      properties:
        type:
          type: string
          description: Error type URI
        title:
          type: string
          description: Short summary of the error
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed human-readable message
        code:
          type: string
          description: Application error code (e.g., ERR_AUTH_INVALID_CREDENTIALS)
        instance:
          type: string
          description: Request URI reference
        invalid_params:
          type: array
          description: List of schema validation violations
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
      required:
        - title
        - status
        - detail
        - code
    def-0:
      type: object
      description: Standardized application error structure adhering to RFC 7807
      properties:
        type:
          type: string
          description: URI identifier for the error type
        title:
          type: string
          description: Human-readable summary of the error
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed and localized error description
        code:
          type: string
          description: Unique application error code (e.g. ERR_AUTH_INVALID_CREDENTIALS)
        instance:
          type: string
          description: URI of the endpoint where the error occurred
        invalid_params:
          type: array
          description: List of parameters that failed validation
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
      required:
        - title
        - status
        - detail
        - code
      title: ProblemDetails
paths:
  /health/live:
    get:
      summary: Liveness Probe
      tags:
        - Health & Monitoring
      description: Checks if the API process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                description: Process is alive
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /health/ready:
    get:
      summary: Readiness Probe
      tags:
        - Health & Monitoring
      description: Checks if the API and database dependency are ready to accept traffic
      responses:
        "200":
          description: Service and database are operational
          content:
            application/json:
              schema:
                description: Service and database are operational
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        "503":
          description: Database check failed
          content:
            application/json:
              schema:
                description: Database check failed
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  database:
                    type: string
                    example: disconnected
                  detail:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /api/v1/auth/login:
    post:
      summary: User Login
      tags:
        - Authentication & Session
      description: Authenticates a user via username or email with Argon2id-protected
        password. Returns short-lived JWT access token and sets secure HttpOnly
        refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: User username or email
                  example: owner.silva
                password:
                  type: string
                  format: password
                  description: Access password
                  example: temp1234
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                description: Authentication successful
                type: object
                properties:
                  access_token:
                    type: string
                    description: Short-lived JWT access token
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Expiration time in seconds
                    example: 900
                  refresh_token:
                    type: string
                    description: Refresh token
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      full_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - OWNER
                          - ADMIN
                          - USER
                      is_active:
                        type: boolean
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/register:
    post:
      summary: User Self-Registration
      tags:
        - Authentication & Session
      description: Registers a new user into the system when self-registration is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: novo.medico@openclinic.local
                username:
                  type: string
                  minLength: 3
                  example: dr.novo
                password:
                  type: string
                  minLength: 8
                  format: password
                  example: MinhaSenhaForte123
                full_name:
                  type: string
                  example: Dr. Novo Silva
                display_name:
                  type: string
                  example: Dr. Silva
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                description: User registered successfully
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      tags:
        - Authentication & Session
      description: Generates a new access token using the refresh token from HttpOnly
        cookie or request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional refresh token in body if not using cookie
      responses:
        "200":
          description: Token renewed successfully
          content:
            application/json:
              schema:
                description: Token renewed successfully
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/profile:
    get:
      summary: Get Authenticated User Profile
      tags:
        - Authentication & Session
      description: Returns profile data, title, role, and groups of the authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                description: User profile
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  email:
                    type: string
                  full_name:
                    type: string
                  job_title:
                    type: string
                    nullable: true
                  role:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/me:
    get:
      summary: Get Authenticated User Profile
      tags:
        - Authentication & Session
      description: Returns profile data, title, role, and groups of the authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                description: User profile
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  email:
                    type: string
                  full_name:
                    type: string
                  job_title:
                    type: string
                    nullable: true
                  role:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/menu:
    get:
      summary: Get Navigation Menu
      tags:
        - Authentication & Session
      description: Returns dynamic navigation menu structure based on active role and
        permissions.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Estrutura de menu com papel e lista de itens
          content:
            application/json:
              schema:
                description: Estrutura de menu com papel e lista de itens
                type: object
                properties:
                  role:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        item_code:
                          type: string
                        label:
                          type: string
                        icon:
                          type: string
                          nullable: true
                        route:
                          type: string
                          nullable: true
                        sort_order:
                          type: number
                        min_role:
                          type: string
                        description:
                          type: string
                          nullable: true
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/change-password:
    post:
      summary: Change Own Password
      tags:
        - Authentication & Session
      description: Allows the authenticated user to change their own password by
        providing their current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  minLength: 8
                  format: password
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Password successfully changed
          content:
            application/json:
              schema:
                description: Password successfully changed
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                required:
                  - code
                  - message
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/forgot-password:
    post:
      summary: Forgot Password Request
      tags:
        - Authentication & Session
      description: Triggers password recovery workflow and generates temporary reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  example: owner@openclinic.local
      responses:
        "200":
          description: Forgot password request processed
          content:
            application/json:
              schema:
                description: Forgot password request processed
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      expires_in_minutes:
                        type: integer
                required:
                  - code
                  - message
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/reset-password:
    post:
      summary: Reset Password via Token
      tags:
        - Authentication & Session
      description: Resets user password using the recovery token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  format: password
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                description: Password reset successfully
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                required:
                  - code
                  - message
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication & Session
      description: Terminates active session and clears the HttpOnly refresh token cookie.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User logged out successfully
          content:
            application/json:
              schema:
                description: User logged out successfully
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/iam/users:
    get:
      summary: List All Users
      tags:
        - User Management (IAM)
      description: Returns list of registered users with roles, active status, and
        lockout state.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                description: Users list
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    email:
                      type: string
                    cpf:
                      type: string
                      nullable: true
                    full_name:
                      type: string
                    job_title:
                      type: string
                      nullable: true
                    role:
                      type: string
                      enum:
                        - OWNER
                        - ADMIN
                        - USER
                    is_active:
                      type: boolean
                    is_locked:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        "400":
          description: Bad request or validation failure (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Unauthenticated or invalid/expired token (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Forbidden — Insufficient role or permissions (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Resource not found (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "500":
          description: Internal server error (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    post:
      summary: Create New User (Admin)
      tags:
        - User Management (IAM)
      description: Creates a new user in the clinic with designated role and initial
        password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - full_name
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: enfermeiro.silva@openclinic.local
                username:
                  type: string
                  minLength: 3
                  example: enf.silva
                cpf:
                  type: string
                  nullable: true
                  example: "52998224725"
                full_name:
                  type: string
                  example: Carlos Silva
                job_title:
                  type: string
                  example: Enfermeiro Chefe
                password:
                  type: string
                  minLength: 8
                  format: password
                  example: temp1234
                role:
                  type: string
                  enum:
                    - OWNER
                    - ADMIN
                    - USER
                  example: USER
                is_active:
                  type: boolean
                  default: true
      security:
        - BearerAuth: []
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                description: User created successfully
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      email:
                        type: string
                      cpf:
                        type: string
                        nullable: true
                      full_name:
                        type: string
                      display_name:
                        type: string
                        nullable: true
                      job_title:
                        type: string
                        nullable: true
                      role:
                        type: string
                      is_active:
                        type: boolean
                required:
                  - code
                  - message
