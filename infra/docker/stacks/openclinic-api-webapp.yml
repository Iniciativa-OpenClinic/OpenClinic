# =============================================================================
# 🚀 OPENCLINIC - DECOUPLED APPLICATION STACK (API + WEBAPP)
# =============================================================================
# File: infra/docker/stacks/openclinic-api-webapp.yml
# Purpose: Decoupled stateless application layer for Docker Swarm / Portainer.
#          Runs WebApp (Vite SPA + Nginx) and REST API (Node.js Fastify).
#          Connects to external database via postgres_network.
# Routing: Traefik (HTTPS with Let's Encrypt / myresolver)
# Security: No direct host ports are exposed. All incoming traffic is routed
#           exclusively through Traefik reverse proxy via traefik_network.
# External networks: traefik_network and postgres_network
# =============================================================================

services:
  # ===========================================================================
  # 1. BACKEND REST API (Fastify Node.js Engine)
  # ===========================================================================
  api:
    image: ${API_IMAGE:-openclinic/openclinic-api}:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME:-openclinic.example.com}}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # === DATABASE (Connection via postgres_network - DML Runtime Only) ===
      - SECRETS_PROVIDER=${SECRETS_PROVIDER:-file}
      - DB_APP_SECRET_NAME=database-secret-app

      # === SECURITY & JWT ===
      - JWT_SECRET_NAME=jwt-secret
    secrets:
      - source: database_secret_app
        target: database-secret-app
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: jwt_secret
        target: jwt-secret
        uid: "1001"
        gid: "1001"
        mode: 0400
    networks:
      - traefik_network
      - postgres_network
      - openclinic_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${APP_PORT:-3000}/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.20"
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_network

        # === SWAGGER DOCS ROUTING DIRECT TO API ===
        - traefik.http.routers.openclinic-api-docs.rule=Host(`${DOMAIN_NAME:-openclinic.example.com}`) && PathPrefix(`/docs`)
        - traefik.http.routers.openclinic-api-docs.entrypoints=websecure
        - traefik.http.routers.openclinic-api-docs.tls=true
        - traefik.http.routers.openclinic-api-docs.tls.certresolver=myresolver
        - traefik.http.routers.openclinic-api-docs.service=openclinic-api-docs-service
        - traefik.http.services.openclinic-api-docs-service.loadbalancer.server.port=${APP_PORT:-3000}

        # === METADATA ===
        - org.openclinic.app=openclinic-api
        - org.openclinic.environment=${ENVIRONMENT:-prod}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 2. FRONTEND WEBAPP (Vite SPA + Nginx Reverse Proxy)
  # ===========================================================================
  webapp:
    image: ${WEBAPP_IMAGE:-openclinic/openclinic-webapp}:${IMAGE_TAG:-latest}
    networks:
      - traefik_network
      - openclinic_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
          cpus: "0.10"
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_network

        # === MAIN HTTPS ROUTING ===
        - traefik.http.routers.openclinic-webapp.rule=Host(`${DOMAIN_NAME:-openclinic.example.com}`)
        - traefik.http.routers.openclinic-webapp.entrypoints=websecure
        - traefik.http.routers.openclinic-webapp.tls=true
        - traefik.http.routers.openclinic-webapp.tls.certresolver=myresolver
        - traefik.http.routers.openclinic-webapp.service=openclinic-webapp-service

        # === SERVICE CONFIGURATION (Nginx Port 80) ===
        - traefik.http.services.openclinic-webapp-service.loadbalancer.server.port=80

        # === AUTOMATIC HTTP -> HTTPS REDIRECT ===
        - traefik.http.routers.openclinic-webapp-http.rule=Host(`${DOMAIN_NAME:-openclinic.example.com}`)
        - traefik.http.routers.openclinic-webapp-http.entrypoints=web
        - traefik.http.routers.openclinic-webapp-http.middlewares=openclinic-webapp-https
        - traefik.http.middlewares.openclinic-webapp-https.redirectscheme.scheme=https

        # === SECURITY HEADERS AND REVERSE PROXY ===
        - traefik.http.routers.openclinic-webapp.middlewares=openclinic-webapp-headers
        - traefik.http.middlewares.openclinic-webapp-headers.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.middlewares.openclinic-webapp-headers.headers.customrequestheaders.X-Forwarded-Port=443

        # === METADATA ===
        - org.openclinic.app=openclinic-webapp
        - org.openclinic.environment=${ENVIRONMENT:-prod}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NETWORKS & SECRETS
# =============================================================================
secrets:
  # Database DML application credentials (structured JSON payload)
  database_secret_app:
    external: true
    name: ${DB_APP_SECRET_NAME:-openclinic-${ENVIRONMENT:-prod}-app-postgres-credentials}

  # Atomic cryptographic JWT signing key
  jwt_secret:
    external: true
    name: ${JWT_SECRET_NAME:-openclinic-${ENVIRONMENT:-prod}-jwt-secret}

networks:
  # Traefik public network (shared reverse proxy)
  traefik_network:
    external: true
    driver: overlay

  # PostgreSQL database network (shared with database stack)
  postgres_network:
    external: true
    driver: overlay

  # Isolated internal network for Nginx webapp proxy to Fastify API (api:3000)
  openclinic_internal:
    driver: overlay
    attachable: true
