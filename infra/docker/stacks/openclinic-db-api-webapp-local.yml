# =============================================================================
# 💻 OPENCLINIC - LOCAL DEVELOPMENT STACK (DATABASE + API + WEBAPP)
# =============================================================================
# File: infra/docker/stacks/openclinic-db-api-webapp-local.yml
# Purpose: Unified stack for local developer onboarding and active development.
#          Builds Fastify API and React WebApp from local repository source code,
#          and starts PostgreSQL 17 in a single integrated Docker bridge network.
# Ports: All 3 services expose ports to the local host:
#        - 80: React WebApp (http://localhost)
#        - 3000: Fastify API & Swagger UI (http://localhost:3000/docs)
#        - 5432: PostgreSQL 17 database (localhost:5432)
# Usage:
#   npm run setup
#   # or directly via Docker Compose:
#   docker compose -f infra/docker/stacks/openclinic-db-api-webapp-local.yml up -d --build
# =============================================================================

services:
  # ===========================================================================
  # 1. POSTGRESQL 17 DATABASE
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: openclinic-db
    environment:
      POSTGRES_DB: ${DB_NAME:-openclinic}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASS:-${POSTGRES_PASSWORD:-openclinic_postgres_password}}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - openclinic_postgres_data:/var/lib/postgresql/data
    networks:
      openclinic_network:
        aliases:
          - openclinic-db
          - postgres
    # Note: DB_HOST is consumed by client applications (api, migration tools), not postgres itself.
    # PostgreSQL listens on 0.0.0.0:5432 inside openclinic_network under aliases 'postgres' and 'openclinic-db'.
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-${POSTGRES_USER:-postgres}} -d ${DB_NAME:-openclinic}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # 2. REST API BACKEND (Fastify Node.js)
  # ===========================================================================
  api:
    image: openclinic-api:latest
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile
    container_name: openclinic-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ../../../secrets:/app/secrets:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SECRETS_PROVIDER=${SECRETS_PROVIDER:-file}
      - DB_APP_SECRET_NAME=${DB_APP_SECRET_NAME:-openclinic-dev-app-postgres-credentials}
      - JWT_SECRET_NAME=${JWT_SECRET_NAME:-openclinic-dev-jwt-secret}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - openclinic_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${APP_PORT:-3000}/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # 3. WEBAPP FRONTEND (Vite SPA + Nginx Reverse Proxy)
  # ===========================================================================
  webapp:
    image: openclinic-webapp:latest
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.webapp
    container_name: openclinic-webapp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-80}:80"
    networks:
      - openclinic_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  openclinic_network:
    name: openclinic_network
    driver: bridge

volumes:
  openclinic_postgres_data:
    name: openclinic_postgres_data
