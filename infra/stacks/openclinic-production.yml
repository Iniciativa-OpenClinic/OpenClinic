version: "3.8"

# =============================================================================
# 🚀 OPENCLINIC - PRODUCTION STACK (PORTAINER / DOCKER SWARM)
# =============================================================================
# Domínio público: openclinic.example.com
# Roteamento: Traefik (HTTPS com Let's Encrypt / myresolver)
# Redes externas: traefik_network e postgres_network
# =============================================================================

services:
  # ===========================================================================
  # 1. FRONTEND WEBAPP (Vite SPA + Nginx Reverse Proxy)
  # ===========================================================================
  webapp:
    image: ${WEBAPP_IMAGE}:${IMAGE_TAG}
    networks:
      - traefik_network
      - openclinic_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
          cpus: "0.10"
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_network

        # === ROTEAMENTO HTTPS PRINCIPAL ===
        - traefik.http.routers.openclinic-webapp.rule=Host(`${DOMAIN_NAME}`)
        - traefik.http.routers.openclinic-webapp.entrypoints=websecure
        - traefik.http.routers.openclinic-webapp.tls=true
        - traefik.http.routers.openclinic-webapp.tls.certresolver=myresolver
        - traefik.http.routers.openclinic-webapp.service=openclinic-webapp-service

        # === CONFIGURAÇÃO DO SERVIÇO (Porta Nginx 80) ===
        - traefik.http.services.openclinic-webapp-service.loadbalancer.server.port=80

        # === REDIRECIONAMENTO AUTOMÁTICO HTTP → HTTPS ===
        - traefik.http.routers.openclinic-webapp-http.rule=Host(`${DOMAIN_NAME}`)
        - traefik.http.routers.openclinic-webapp-http.entrypoints=web
        - traefik.http.routers.openclinic-webapp-http.middlewares=openclinic-webapp-https
        - traefik.http.middlewares.openclinic-webapp-https.redirectscheme.scheme=https

        # === HEADERS DE SEGURANÇA E PROXY ===
        - traefik.http.routers.openclinic-webapp.middlewares=openclinic-webapp-headers
        - traefik.http.middlewares.openclinic-webapp-headers.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.middlewares.openclinic-webapp-headers.headers.customrequestheaders.X-Forwarded-Port=443

        # === METADATA ===
        - org.openclinic.app=openclinic-webapp
        - org.openclinic.environment=production

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 2. BACKEND REST API (Fastify Node.js Engine)
  # ===========================================================================
  api:
    image: ${API_IMAGE}:${IMAGE_TAG}
    environment:
      - NODE_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - LOG_LEVEL=${LOG_LEVEL}

      # === DATABASE (Conexão ao PostgreSQL via postgres_network - DML Runtime Only) ===
      - SECRETS_PROVIDER=file
      - DB_APP_SECRET_NAME=database-secret-app

      # === SECURITY & JWT ===
      - JWT_SECRET_NAME=jwt-secret
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    secrets:
      - source: database_secret_app
        target: database-secret-app
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: jwt_secret_key
        target: jwt-secret
        uid: "1001"
        gid: "1001"
        mode: 0400
    networks:
      - postgres_network
      - openclinic_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.20"
      labels:
        - org.openclinic.app=openclinic-api
        - org.openclinic.environment=production

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# REDES (NETWORKS) & SECRETS
# =============================================================================
secrets:
  database_secret_app:
    external: true
    name: ${DB_APP_SECRET_SWARM_NAME:-database-secret-app}
  jwt_secret_key:
    external: true
    name: ${JWT_SECRET_SWARM_NAME:-jwt-secret}


networks:
  # Rede pública do Traefik (Compartilhada na VPS)
  traefik_network:
    external: true
    driver: overlay

  # Rede do PostgreSQL (Compartilhada na VPS com o container do banco)
  postgres_network:
    external: true
    driver: overlay

  # Rede isolada interna para o Nginx falar com o backend Fastify (api:3000)
  openclinic_internal:
    driver: overlay
    attachable: true
